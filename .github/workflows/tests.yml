name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Development happens on macOS, so CI covers the other two systems the
    # team and the demo laptop may use.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
