; Ceratek lathe: FluidNC v4.1.1 + the lathe_screen module (TS35 touchscreen and guided sequence).
; platformio.ini (unchanged from FluidNC v4.1.1) reads this file through extra_configs.
; FluidNC ships its own platformio_override.ini and this file replaces it, so its
; sections are kept below unchanged (they compile i2s_engine.cpp with -fpermissive).
;
;   pio run -e ceratek              build without Wi-Fi (default; same flash layout as the board has now)
;   pio run -e ceratek_wifi         build with Wi-Fi and the web page (8 MB flash layout)
;   pio run -e ceratek -t upload    build and write to the board

; ---- FluidNC v4.1.1's own platformio_override.ini, unchanged ----
[env:oled]
extends = env:wifi
build_src_filter = ${env:wifi.build_src_filter} +<src/OLED.cpp>

; extra_scripts REPLACES the value inherited via "extends" rather than adding to
; it, so these must repeat ${common_esp32.extra_scripts} explicitly.  Leaving it
; out silently drops FluidNC/ld/esp32/vtable_in_dram.py, which is what puts the
; PinDetail and Spindle vtables in DRAM.  Without it they land in flash, and the
; step ISR reads them - which panics the board whenever the flash cache happens
; to be disabled.

[env:wifi]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

[env:noradio]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

[env:bt]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

; ---- Ceratek additions ----

[ceratek_common]
; FluidNC v4.1.1 takes the platform from the git main branch, which has since moved to
; espressif32 8.x (new toolchains, Arduino 3.x). Pin the release that matches Arduino
; core 2.0.17 so every build gets the same tools.
platform = platformio/espressif32 @ 6.10.0
lathe_lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.3.0
lathe_src_filter =
    +<../lathe/*.cpp>
    +<../lathe/core/*.cpp>
lathe_build_flags =
    -DCERATEK_LATHE_SCREEN
; The bench notes found this USB link loses data above 115200 baud.
upload_speed = 115200

[env:ceratek]
extends = env:noradio
platform = ${ceratek_common.platform}
lib_deps =
    ${env:noradio.lib_deps}
    ${ceratek_common.lathe_lib_deps}
build_src_filter =
    ${env:noradio.build_src_filter}
    ${ceratek_common.lathe_src_filter}
build_flags =
    ${env:noradio.build_flags}
    ${ceratek_common.lathe_build_flags}
upload_speed = ${ceratek_common.upload_speed}

[env:ceratek_wifi]
extends = env:wifi
platform = ${ceratek_common.platform}
lib_deps =
    ${env:wifi.lib_deps}
    ${ceratek_common.lathe_lib_deps}
build_src_filter =
    ${env:wifi.build_src_filter}
    ${ceratek_common.lathe_src_filter}
build_flags =
    ${env:wifi.build_flags}
    ${ceratek_common.lathe_build_flags}
upload_speed = ${ceratek_common.upload_speed}
; The Wi-Fi image with the screen may not fit the 4 MB layout, so this one uses the
; controller's full 8 MB. Changing layout moves the file system: config.yaml must be
; uploaded again after the first flash of this image (and after going back).
board_build.partitions = FluidNC/ld/esp32/app3M_spiffs1M_8MB.csv
board_upload.flash_size = 8MB

; Stock FluidNC v4.1.1 (Wi-Fi), exactly the firmware tested on 2026-11-14, written at 115200 baud.
; Used by "./lathe.sh restore" together with config_stock.yaml.
[env:stock_wifi]
extends = env:wifi
platform = ${ceratek_common.platform}
upload_speed = ${ceratek_common.upload_speed}
